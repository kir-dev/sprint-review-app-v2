# Staging CD pipeline, following the StartSCH/ehk pattern.
#
# On every push to the `staging` branch it builds the frontend and backend
# images, publishes them to ghcr.io, creates a Git tag (Renovate needs it to
# show a diff link), and then runs Renovate against kir-dev/k8s. Renovate opens
# (or updates) a PR that bumps `sprint-review-staging/versions.ts` to the new
# digests; ArgoCD rolls the staging instance out once that PR is merged.
#
# Required repository secret:
#   KIR_DEV_BOT_PAT  PAT of the `kir-dev-bot` account, passed to Renovate as
#                    RENOVATE_TOKEN. Same token the StartSCH/ehk workflows use.
#                    Images go to ghcr.io via the built-in GITHUB_TOKEN, so no
#                    registry secret is needed.
name: Deploy Staging

on:
  push:
    branches: ['staging']
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'package.json'
      - 'yarn.lock'
      - '.dockerignore'
      - '.github/workflows/deploy-staging.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sprint-review-app-v2-frontend
          tags: |
            # Version from the run number so Renovate can find the latest release.
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=staging
            type=sha,format=long

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sprint-review-app-v2-backend
          tags: |
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=staging
            type=sha,format=long

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Renovate needs a Git tag to show a GitHub diff link.
      - name: Create Git tag
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

  update-k8s:
    name: Update kir-dev/k8s
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      # The TypeScript Renovate config lives in kir-dev/k8s (.dev/renovate.ts).
      - name: Checkout k8s
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kir-dev/k8s
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      # bunx runs Renovate with Node; renovate@44 requires Node ^24.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Renders sprint-review-staging/renovate.ts and opens/updates a PR on kir-dev/k8s.
      - run: bun run renovate sprint-review-staging
        env:
          RENOVATE_TOKEN: ${{ secrets.KIR_DEV_BOT_PAT }}
