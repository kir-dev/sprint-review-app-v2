# Runs the production image locally: the API and the frontend in one process
# on http://localhost:3000. Development does not need this (`yarn dev`).
#   docker compose up --build
services:
  app:
    build:
      context: .
    container_name: sprint_review_app
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # DATABASE_URL is supplied through the deployment environment. From the
      # container, a database on the host is host.docker.internal.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTHSCH_CLIENT_ID: ${AUTHSCH_CLIENT_ID}
      AUTHSCH_CLIENT_SECRET: ${AUTHSCH_CLIENT_SECRET}
      AUTHSCH_GROUP_ID: ${AUTHSCH_GROUP_ID}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
