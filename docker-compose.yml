# Runs the production image: the API and the frontend in one process on port
# 3000. For local development use `yarn dev` instead.
#
# The image runs in production mode, which requires APP_URL to be an HTTPS,
# non-loopback origin and sets Secure cookies. Put a TLS-terminating proxy in
# front of port 3000 and set APP_URL to its public origin.
#   APP_URL=https://sprint-review.example.test docker compose up --build
services:
  app:
    build:
      context: .
    container_name: sprint_review_app
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # DATABASE_URL is supplied through the deployment environment. From the
      # container, a database on the host is host.docker.internal.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTHSCH_CLIENT_ID: ${AUTHSCH_CLIENT_ID}
      AUTHSCH_CLIENT_SECRET: ${AUTHSCH_CLIENT_SECRET}
      AUTHSCH_GROUP_ID: ${AUTHSCH_GROUP_ID}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:?Set APP_URL to the HTTPS origin of the proxy in front}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
