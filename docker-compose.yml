version: '3.8'

services:
  # db:
  #   image: postgres:13
  #   container_name: sprint_review_db
  #   restart: always
  #   environment:
  #     POSTGRES_USER: admin
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: sprint-review-app
  #   ports:
  #     - '127.0.0.1:5432:5432'
  #   volumes:
  #     - sprintreview_db_folder_v2:/var/lib/postgresql/data
  #   networks:
  #     - app-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sprint_review_backend
    # depends_on:
    #   - db
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      # DATABASE_URL: postgres://admin:password@db:5432/sprint-review-app
      # Add other necessary env vars here or use an env_file
      AUTHSCH_CLIENT_ID: ${AUTHSCH_CLIENT_ID}
      AUTHSCH_CLIENT_SECRET: ${AUTHSCH_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    networks:
      - app-network
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules

  # Production frontend image (Next.js standalone server).
  # Behind the "prod" profile so `docker-compose up` (used by `yarn dev`) does
  # NOT start it and clash with the host `next dev` on port 3000.
  # Run it explicitly with:  docker compose --profile prod up -d frontend
  frontend:
    profiles: ['prod']
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sprint_review_frontend
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # Server-side requests use the Compose service name. The public URL is
      # injected into the browser for the AuthSCH redirect.
      BACKEND_INTERNAL_URL: http://backend:3001
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3001}
      PORT: 3000
    networks:
      - app-network

# volumes:
#   sprintreview_db_folder_v2:

networks:
  app-network:
    driver: bridge
